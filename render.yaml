# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One free web service. No database, no background worker, no cron: the fee
# engine is stateless and the FX snapshot is a file in the repo, so there is
# nothing to persist and nothing to keep warm except the process.
#
# The PayPal credentials are SANDBOX credentials and are what let the deployed
# app make a real Invoicing API call. A sandbox app cannot move real money, and
# PayPalClient refuses a non-sandbox host unless allow_live=True is passed in
# code, so hosting them is the point rather than a risk. `sync: false` keeps the
# values in the dashboard, never in this file.
#
# Without them the app still works: the "Create invoice" button is hidden and
# /api/health reports paypal_configured: false. The quote is arithmetic on a
# local file and needs no network.
#
# OPENROUTER_API_KEY uses `sync: false`, which means Render prompts for the
# value in the dashboard and never reads it from this file. A key in a committed
# YAML file is a key in a git history.

services:
  - type: web
    name: feelens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "nvidia/nemotron-3-ultra-550b-a55b:free"
      - key: LLM_FALLBACK_MODEL
        value: "poolside/laguna-s-2.1:free"
      # The free tier is 50 requests a day, shared by every visitor to this URL.
      # These caps are what stop one crawler from spending the day's budget
      # before a judge arrives. Exceeding either returns the template, which is
      # still correct.
      - key: MODEL_EXPLAINS_PER_WINDOW
        value: "6"
      - key: MODEL_WINDOW_MINUTES
        value: "10"
      - key: MODEL_DAILY_REQUEST_CAP
        value: "44"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_INVOICES_PER_WINDOW
        value: "3"
